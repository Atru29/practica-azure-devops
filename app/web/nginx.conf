# =====================================================================
#  nginx del contenedor del frontend.
#
#  Hace dos cosas:
#    1. servir los ficheros estaticos de Angular
#    2. reenviar /api/* al contenedor de la API
#
#  Lo segundo es lo importante: el navegador ve UN SOLO origen, asi que
#  CORS no llega a existir. Es el mismo papel que hacia proxy.conf.json
#  en desarrollo.
#
#  Y termina el TLS: 8443 es el HTTPS de verdad; 8080 solo redirige.
#  Puertos altos porque nginx corre sin privilegios: en la maquina se
#  publican como 443 y 80.
# =====================================================================

# --- HTTP: solo redirigir, salvo los retos de Let's Encrypt ---
server {
    listen       8080;
    server_name  _;
    server_tokens off;

    # Para renovar, Let's Encrypt pide un fichero en esta ruta POR HTTP:
    # es como comprueba que el dominio es tuyo. certbot, en la maquina,
    # lo deja en /var/www/certbot, que se monta aqui en solo lectura.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen       8443 ssl;
    http2        on;
    server_name  _;

    # Los copia de /etc/letsencrypt el deploy hook de certbot, con dueno
    # el uid 101 (nginx): la clave original solo la puede leer root.
    ssl_certificate      /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key  /etc/nginx/tls/privkey.pem;

    # TLS 1.0 y 1.1 estan rotos y ningun navegador actual los necesita.
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_session_cache    shared:TLS:10m;
    ssl_session_timeout  1d;

    root  /usr/share/nginx/html;
    index index.html;

    # No anunciar la version de nginx en las cabeceras ni en las
    # paginas de error: es informacion gratis para quien busca fallos
    # conocidos de una version concreta.
    server_tokens off;

    # --- compresion ---
    # El JavaScript de Angular baja de ~280 kB a ~80 kB.
    gzip             on;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_proxied     any;
    gzip_types       text/plain text/css application/javascript
                     application/json image/svg+xml;

    # --- cabeceras de seguridad ---
    #
    # OJO con add_header: NO es acumulativo entre niveles. Un bloque
    # location que tenga sus propios add_header descarta TODOS los del
    # servidor, no los suma. Por eso hay que repetirlas en cada location
    # que fije Cache-Control, y se sacan a un fichero aparte para no
    # tener tres copias que se desincronicen.
    include /etc/nginx/conf.d/seguridad.inc;

    # --- la API ---
    location /api/ {
        # 'api' es el nombre del servicio en docker-compose; 8080 es el
        # puerto REAL del contenedor, no el publicado hacia fuera.
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generar una constancia puede tardar unos segundos la primera
        # vez; 60 s da margen de sobra sin dejar peticiones colgadas.
        proxy_read_timeout 60s;
    }

    location = /salud {
        proxy_pass http://api:8080/salud;
    }

    # --- ficheros con huella en el nombre ---
    # Angular les pone un hash (main-ABC123.js), asi que al cambiar el
    # codigo cambia el nombre. Se pueden cachear para siempre sin
    # riesgo de servir una version vieja.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        include    /etc/nginx/conf.d/seguridad.inc;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # --- el resto: siempre index.html ---
    # Angular enruta en el navegador. Si alguien entra directamente a
    # /mis-matriculas, ese fichero no existe en disco: hay que devolver
    # index.html y dejar que Angular decida. Sin esto, recargar en
    # cualquier pagina que no sea la raiz da un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html NUNCA se cachea: es quien dice cuales son los ficheros
    # con hash de la version actual.
    location = /index.html {
        include    /etc/nginx/conf.d/seguridad.inc;
        expires    -1;
        add_header Cache-Control "no-store";
    }
}
